<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Enough</title>
    <link rel="stylesheet" href="src/ui.css" />
  </head>
  <body class="popup-shell">
    <main>
      <header class="brand-row"><span class="brand-mark" aria-hidden="true">E</span><div><strong>Enough</strong><p id="connection-status" role="status">Checking connection…</p></div></header>
      <section id="signed-in" hidden>
        <label>Product<select id="product-select" aria-label="Active product"></select></label>
        <fieldset class="mode-row" aria-label="Focus mode">
          <button id="build-mode" type="button">Build</button>
          <button id="growth-mode" type="button">Growth</button>
        </fieldset>
        <p id="mode-description" class="muted"></p>
        <label class="check-row"><input id="tracking-toggle" type="checkbox" />Record visited domains in Enough</label>
        <p class="fine-print">Only the domain name and policy result are recorded. Page paths and content are not collected.</p>
        <p id="tracking-consent-status" class="fine-print" role="status"></p>
        <div class="status-grid"><span>Last policy sync</span><strong id="sync-time">Never</strong><span>Blocked domain rules</span><strong id="blocking-count">0</strong><span>Queued activity</span><strong id="event-count">0</strong><span>Desktop agent</span><strong id="native-status">Not connected</strong></div>
        <p id="extension-error" class="error" role="alert" hidden></p>
        <div class="button-row"><button id="sync-button" class="secondary-button" type="button">Sync policy</button><button id="native-button" class="secondary-button" type="button">Connect desktop agent</button></div>
        <div class="button-row"><button id="settings-button" class="quiet-button" type="button">Settings</button><button id="sign-out-button" class="quiet-button" type="button">Sign out</button></div>
      </section>
      <section id="signed-out" hidden>
        <p>Connect your Enough account to sync its browser policy.</p>
        <button id="configure-button" class="primary-button" type="button">Open extension settings</button>
      </section>
    </main>
    <script type="module" src="src/popup.ts"></script>
  </body>
</html>
