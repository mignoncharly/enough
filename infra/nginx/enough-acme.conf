# Temporary HTTP-only site used to obtain the initial certificate.
server {
    listen 80;
    listen [::]:80;
    server_name enough.example.com api.enough.example.com;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        default_type text/plain;
        try_files $uri =404;
    }

    location / {
        return 404;
    }
}
